name: "Automated Release"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildConfiguration:
        description: "Build Configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      versionPreReleaseTag:
        # Use alpha, beta, or rc for pre-release. An empty string for stable.
        description: "Pre-Release Tag"
        required: true
        default: ""
        type: choice
        options:
          - "alpha"
          - "beta"
          - "RC"
          - ""
      createTagsAndRelease:
        # Only consulted for workflow_dispatch. A push to main always releases and tags.
        description: "Create Tags and Release"
        required: true
        default: true
        type: boolean

env:
  projectName: SRTHost
  configuration: ${{ github.event.inputs.buildConfiguration || 'Release' }}
  versionPreReleaseTag: ${{ github.event.inputs.versionPreReleaseTag || '' }}
  wixVersion: "5.0.2"

jobs:
  setup:
    name: Setup Environment
    runs-on: windows-2025-vs2026

    outputs:
      verMajor: ${{steps.version-parts.outputs.version_major}}
      verMinor: ${{steps.version-parts.outputs.version_minor}}
      verPatch: ${{steps.version-parts.outputs.version_patch}}
      verPreReleaseTag: ${{steps.version-parts.outputs.version_prereltag}}
      verBuild: ${{steps.build-number.outputs.current_build_number}}
      verSHAHash: ${{steps.short-sha-hash.outputs.short_sha_hash}}
      verFullTag: ${{steps.semver-string.outputs.fulltag_string}}
      verSemVerString: ${{steps.semver-string.outputs.semver_string}}

    steps:
      # Off main the build's only tag is vN.M.P-<tag>+B, so an empty pre-release tag would publish
      # a stable-looking vN.M.P+B from a side branch. Fail before anything is built or signed.
      - name: Require a pre-release tag when releasing off main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.event.inputs.createTagsAndRelease == 'true' && github.event.inputs.versionPreReleaseTag == '' }}
        run: |
          Write-Output "::error::Releasing from ${{ github.ref_name }} requires a Pre-Release Tag of alpha, beta or RC."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version parts
        id: version-parts
        run: |
          [string[]]$versionParts = (Get-Content -Path "version.txt" -Raw).Split('.');
          echo "version_major=$($versionParts[0])" >> $env:GITHUB_OUTPUT
          echo "version_minor=$($versionParts[1])" >> $env:GITHUB_OUTPUT
          echo "version_patch=$($versionParts[2])" >> $env:GITHUB_OUTPUT
          echo "version_prereltag=${{env.versionPreReleaseTag}}" >> $env:GITHUB_OUTPUT

      - name: Get new build number
        id: build-number
        run: |
          $build_number = $((${{ vars.BUILD_NUMBER }} + 1))
          echo "current_build_number=$build_number" >> $env:GITHUB_OUTPUT

      - name: Get short SHA hash
        id: short-sha-hash
        run: |
          $short_sha_hash = $(("${{ github.sha }}".substring(0, 7)))
          echo "short_sha_hash=$short_sha_hash" >> $env:GITHUB_OUTPUT

      - name: Get SemVer string
        id: semver-string
        run: |
          [string]$semver_string = "${{steps.version-parts.outputs.version_major}}.${{steps.version-parts.outputs.version_minor}}.${{steps.version-parts.outputs.version_patch}}";

          if (![string]::IsNullOrWhitespace("${{steps.version-parts.outputs.version_prereltag}}")) {
            $semver_string += "-${{steps.version-parts.outputs.version_prereltag}}";
          }

          $semver_string += "+${{steps.build-number.outputs.current_build_number}}";
          echo "fulltag_string=$semver_string" >> $env:GITHUB_OUTPUT;

          $semver_string += ".${{steps.short-sha-hash.outputs.short_sha_hash}}";
          echo "semver_string=$semver_string" >> $env:GITHUB_OUTPUT;

  build:
    name: "Build"
    runs-on: windows-2025-vs2026
    needs: setup
    strategy:
      matrix:
        platform: [x86, x64]
    env:
      working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set versioning environment variable
        run: |
          echo 'VERSION=${{needs.Setup.outputs.verSemVerString}}' >> $env:GITHUB_ENV
          echo 'PRODUCTVERSION=${{needs.Setup.outputs.verSemVerString}}' >> $env:GITHUB_ENV
          echo 'FILEVERSION=${{needs.Setup.outputs.verMajor}}.${{needs.Setup.outputs.verMinor}}.${{needs.Setup.outputs.verPatch}}.${{needs.Setup.outputs.verBuild}}' >> $env:GITHUB_ENV
          echo 'ASSEMBLYVERSION=${{needs.Setup.outputs.verMajor}}.0.0.0' >> $env:GITHUB_ENV

      # The .NET 10 SDK builds this net5.0-windows project fine; it only warns NETSDK1138 that the
      # target framework is out of support. No .NET 5 SDK is needed on the runner.
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      # Framework-dependent publish. The runtime is delivered by the installer rather than bundled
      # into the executables, so these are ~550 KB each instead of ~150 MB.
      - name: Publish
        run: |
          dotnet publish "src/${{env.projectName}}.slnx" -c ${{env.configuration}} -p:Platform=${{matrix.platform}} -p:PublishProfile=${{matrix.platform}} -p:Version=$env:VERSION -p:ProductVersion=$env:PRODUCTVERSION -p:FileVersion=$env:FILEVERSION -p:AssemblyVersion=$env:ASSEMBLYVERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{matrix.platform}}
          # The whole publish directory: the executable, its .pdb, and the loose
          # SRTPluginBase.dll/.pdb. Each matrix leg runs on its own runner, so the two legs cannot
          # collide here even though they use the same path; they are merged in the package job.
          path: src/${{env.projectName}}/bin/${{env.configuration}}/net5.0-windows/publish/

  package:
    name: "Package"
    runs-on: windows-2025-vs2026
    needs: [ setup, build ]
    # Moving tags and publishing a release both need write access to repo contents.
    permissions:
      contents: write
    env:
      working-directory: .
      is-prerelease: true
      # Both matrix artifacts are merged into one flat folder - the same shape a local publish
      # produces. The only filenames they share are SRTPluginBase.dll and SRTPluginBase.pdb, and
      # both are byte-identical between the two platforms, so whichever wins is immaterial.
      publish-dir: ${{ github.workspace }}\ArtifactsPublish
      msi-path: ${{ github.workspace }}\src\SRTHostSetup\SRTHostPackage\bin\Release\SRTHost.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Artifacts-*
          merge-multiple: true
          path: ${{ env.publish-dir }}

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      # Needed for `wix burn detach` / `wix burn reattach` below. The WiX build SDK itself arrives
      # via PackageReference on the wixproj files and does not need this tool.
      - name: Install WiX CLI
        run: dotnet tool install --global wix --version ${{env.wixVersion}}

      - name: Set installer version variables
        run: |
          echo 'SETUP_PRODUCT_VERSION=${{needs.Setup.outputs.verMajor}}.${{needs.Setup.outputs.verMinor}}.${{needs.Setup.outputs.verPatch}}.${{needs.Setup.outputs.verBuild}}' >> $env:GITHUB_ENV
          echo 'SETUP_MSI_VERSION=${{needs.Setup.outputs.verMajor}}.${{needs.Setup.outputs.verMinor}}.${{needs.Setup.outputs.verPatch}}' >> $env:GITHUB_ENV
          echo 'SETUP_OUTPUT_NAME=SRTHostSetup-v${{needs.Setup.outputs.verSemVerString}}' >> $env:GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: "{\"clientId\":\"${{ secrets.ASTJG_AZURE_CLIENT_ID
            }}\",\"clientSecret\":\"${{ secrets.ASTJG_AZURE_CLIENT_SECRET
            }}\",\"subscriptionId\":\"${{ secrets.ASTJG_AZURE_SUBSCRIPTION_ID
            }}\",\"tenantId\":\"${{ secrets.ASTJG_AZURE_TENANT_ID }}\"}"

      # Signing must follow containment order. Each file is signed before whatever embeds it is
      # built, otherwise the outer container captures an unsigned copy:
      #   host binaries -> MSI -> bundle (engine detached, signed, reattached) -> bundle as a whole
      #
      # SRTPluginBase.dll is signed here too: it is published loose rather than bundled into the
      # executables, so nothing else would cover it.
      - name: Sign host binaries with Trusted Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.ASTJG_AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.ASTJG_AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.ASTJG_AZURE_CLIENT_SECRET }}
          endpoint: https://ncus.codesigning.azure.net/
          signing-account-name: AS-TJGutjahr
          certificate-profile-name: AS-CP-TJGutjahr
          files: |
            ${{ env.publish-dir }}\SRTHost32.exe
            ${{ env.publish-dir }}\SRTHost64.exe
            ${{ env.publish-dir }}\SRTPluginBase.dll
          file-digest: SHA512
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA512

      - name: Build MSI
        run: |
          dotnet build "src\SRTHostSetup\SRTHostPackage\SRTHostPackage.wixproj" -c Release -t:Rebuild -p:SRTHostMsiVersion=$env:SETUP_MSI_VERSION -p:SRTHostPublishDir=${{ env.publish-dir }}\

      - name: Sign MSI with Trusted Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.ASTJG_AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.ASTJG_AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.ASTJG_AZURE_CLIENT_SECRET }}
          endpoint: https://ncus.codesigning.azure.net/
          signing-account-name: AS-TJGutjahr
          certificate-profile-name: AS-CP-TJGutjahr
          files: ${{ env.msi-path }}
          file-digest: SHA512
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA512

      # BuildProjectReferences=false is load-bearing. Without it the bundle rebuilds the MSI and
      # silently discards the signature applied in the previous step.
      - name: Build bundle
        run: |
          dotnet build "src\SRTHostSetup\SRTHostBundle\SRTHostBundle.wixproj" -c Release -t:Rebuild -p:BuildProjectReferences=false -p:SRTHostProductVersion=$env:SETUP_PRODUCT_VERSION -p:SRTHostMsiVersion=$env:SETUP_MSI_VERSION -p:SRTHostOutputName=$env:SETUP_OUTPUT_NAME

      # A Burn bundle cannot be signed by running signtool over the built output, because the
      # payload containers are attached to the engine. Detach the engine, sign it, reattach it,
      # then sign the whole thing. This is the WiX v4+ replacement for v3's `insignia -ib` / `-ab`.
      - name: Detach Burn engine
        run: |
          wix burn detach "src\SRTHostSetup\SRTHostBundle\bin\Release\$env:SETUP_OUTPUT_NAME.exe" -engine "${{ github.workspace }}\engine.exe"

      - name: Sign Burn engine with Trusted Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.ASTJG_AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.ASTJG_AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.ASTJG_AZURE_CLIENT_SECRET }}
          endpoint: https://ncus.codesigning.azure.net/
          signing-account-name: AS-TJGutjahr
          certificate-profile-name: AS-CP-TJGutjahr
          files: ${{ github.workspace }}\engine.exe
          file-digest: SHA512
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA512

      - name: Reattach signed Burn engine
        run: |
          wix burn reattach "src\SRTHostSetup\SRTHostBundle\bin\Release\$env:SETUP_OUTPUT_NAME.exe" -engine "${{ github.workspace }}\engine.exe" -o "${{ github.workspace }}\$env:SETUP_OUTPUT_NAME.exe"

      - name: Sign installer with Trusted Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.ASTJG_AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.ASTJG_AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.ASTJG_AZURE_CLIENT_SECRET }}
          endpoint: https://ncus.codesigning.azure.net/
          signing-account-name: AS-TJGutjahr
          certificate-profile-name: AS-CP-TJGutjahr
          files: ${{ github.workspace }}\${{ env.SETUP_OUTPUT_NAME }}.exe
          file-digest: SHA512
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA512

      # Kept alongside the installer for portable use. These executables are framework-dependent
      # now, so the zip requires .NET 5 to already be present - the installer is the only path
      # that provisions the runtime.
      - name: Zip the publish artifacts
        run: |
          Add-Type -assembly 'System.IO.Compression'
          Add-Type -assembly 'System.IO.Compression.FileSystem'
          [System.IO.Compression.ZipArchive]$zipFile = [System.IO.Compression.ZipFile]::Open('${{env.projectName}}_v${{needs.Setup.outputs.verSemVerString}}.zip', ([System.IO.Compression.ZipArchiveMode]::Create))
          [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zipFile, 'LICENSE', 'LICENSE')
          $filesToZip = (Get-ChildItem -Path '${{ env.publish-dir }}' -File -Recurse).FullName
          foreach ($fileToZip in $filesToZip) {
            $fileNameInZip = $fileToZip.Replace(('${{ env.publish-dir }}' + '\'),'')
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zipFile, $fileToZip, $fileNameInZip)
          }
          $zipFile.Dispose()

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Installer
          path: ${{ github.workspace }}\${{ env.SETUP_OUTPUT_NAME }}.exe

      # The rolling tags (latest, vN, vN.M, vN.M.P) plus this build's own vN.M.P+B. Force-moved,
      # so this runs for the main line only: every push to main, and a dispatch against main when
      # Create Tags and Release is checked. A dispatch against any other branch skips this
      # entirely and gets just its own vN.M.P-<tag>+B, created by the release step below.
      #
      # `github.event_name == 'push'` is sufficient to mean main here because the push trigger is
      # restricted to that branch.
      - name: Create additional version tags
        if: ${{ github.event_name == 'push' || (github.event.inputs.createTagsAndRelease == 'true' && github.ref == 'refs/heads/main') }}
        run: |
          git tag -f latest
          git push origin latest --force

          git tag -f v${{ needs.Setup.outputs.verMajor }}
          git push origin v${{ needs.Setup.outputs.verMajor }} --force

          git tag -f v${{ needs.Setup.outputs.verMajor }}.${{ needs.Setup.outputs.verMinor }}
          git push origin v${{ needs.Setup.outputs.verMajor }}.${{ needs.Setup.outputs.verMinor }} --force

          git tag -f v${{ needs.Setup.outputs.verMajor }}.${{ needs.Setup.outputs.verMinor }}.${{ needs.Setup.outputs.verPatch }}
          git push origin v${{ needs.Setup.outputs.verMajor }}.${{ needs.Setup.outputs.verMinor }}.${{ needs.Setup.outputs.verPatch }} --force

          git tag -f v${{needs.Setup.outputs.verFullTag}}
          git push origin v${{needs.Setup.outputs.verFullTag}} --force

      # Always released for a push to main; for a dispatch, only when Create Tags and Release is
      # checked - on any branch. Off main this step is what creates the build's only tag,
      # vN.M.P-<tag>+B, since the rolling-tag step above does not run there.
      #
      # Everything is published as a pre-release. Unchecking that is a manual step after review.
      - name: Publish release
        uses: ncipollo/release-action@v1
        if: ${{ github.event_name == 'push' || github.event.inputs.createTagsAndRelease == 'true' }}
        with:
          name: "Automated Build - v${{needs.Setup.outputs.verSemVerString}} Release"
          tag: v${{needs.Setup.outputs.verFullTag}}
          commit: ${{ github.sha }}
          prerelease: ${{env.is-prerelease}}
          artifacts: "${{ env.SETUP_OUTPUT_NAME }}.exe,${{env.projectName}}_v${{needs.Setup.outputs.verSemVerString}}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}

  postrun:
    name: Post-Run
    runs-on: windows-2025-vs2026
    needs: [ setup, package ]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Update build number variable
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLE_RW_TOKEN }}
        run: gh variable set BUILD_NUMBER -b${{needs.Setup.outputs.verBuild}}
